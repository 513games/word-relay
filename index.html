<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>-EN / -EK Translator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #0d1117;
      color: #f0f6fc;

      font-family: Arial, sans-serif;
    }

    .translator {
      width: 100%;
      max-width: 700px;
      padding: 28px;

      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;

      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      text-align: center;
    }

    .description {
      margin-top: 0;
      margin-bottom: 24px;

      color: #8b949e;
      text-align: center;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      padding: 14px;
      margin-bottom: 16px;

      resize: vertical;

      background: #21262d;
      color: #f0f6fc;

      border: 1px solid #30363d;
      border-radius: 10px;

      font-family: inherit;
      font-size: 17px;
      line-height: 1.5;
    }

    textarea:focus {
      outline: 2px solid #58a6ff;
      border-color: transparent;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    button {
      flex: 1;
      padding: 12px 16px;

      border: none;
      border-radius: 9px;

      background: #238636;
      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.12);
    }

    #copyButton {
      background: #1f6feb;
    }

    #clearButton {
      background: #30363d;
    }

    .examples {
      margin-top: 8px;
      padding: 14px;

      background: #21262d;
      border-radius: 10px;

      color: #8b949e;
      line-height: 1.7;
    }

    .examples strong {
      color: #f0f6fc;
    }

    #message {
      min-height: 20px;
      margin-top: -8px;
      margin-bottom: 12px;

      color: #3fb950;
      font-size: 14px;
    }

    @media (max-width: 550px) {
      .buttons {
        flex-direction: column;
      }

      .translator {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <main class="translator">
    <h1>-EN / -EK Translator</h1>

    <p class="description">
      Consonant beginnings move to the end and receive
      <strong>-en</strong>.
      Vowel beginnings receive
      <strong>s-</strong> and <strong>-ek</strong>.
    </p>

    <label for="inputText">English</label>

    <textarea
      id="inputText"
      placeholder="Type something here..."
    ></textarea>

    <div class="buttons">
      <button id="translateButton">Translate</button>
      <button id="copyButton">Copy</button>
      <button id="clearButton">Clear</button>
    </div>

    <div id="message"></div>

    <label for="outputText">Translation</label>

    <textarea
      id="outputText"
      placeholder="Your translation will appear here..."
      readonly
    ></textarea>

    <div class="examples">
      <strong>Examples</strong><br>
      crap → apcren<br>
      car → arcen<br>
      ear → searek<br>
      apple → sappleek<br>
      quick → ickquen<br>
      I am → Siek samek<br>
      I’m → Si’mek<br>
      store → oresten
    </div>
  </main>

  <script>
    const inputText =
      document.getElementById("inputText");

    const outputText =
      document.getElementById("outputText");

    const translateButton =
      document.getElementById("translateButton");

    const copyButton =
      document.getElementById("copyButton");

    const clearButton =
      document.getElementById("clearButton");

    const message =
      document.getElementById("message");

    const vowels = "aeiou";

    function translateWord(originalWord) {
      const word = originalWord.toLowerCase();

      if (!word) {
        return "";
      }

      let translatedWord = "";

      /*
        VOWEL-STARTING WORDS

        Add S to the beginning
        and EK to the end.

        I      → siek
        am     → samek
        apple  → sappleek
        orange → sorangeek
      */
      if (vowels.includes(word[0])) {

        translatedWord =
          "s" + word + "ek";

      } else {

        /*
          CONSONANT-STARTING WORDS

          Move the opening consonant
          or consonant cluster to the end
          and add EN.

          car   → ar + c + en
          crap  → ap + cr + en
          store → ore + st + en
      */

        let firstVowelPosition = 0;

        while (
          firstVowelPosition < word.length
        ) {

          const currentLetter =
            word[firstVowelPosition];

          const nextLetter =
            word[firstVowelPosition + 1];

          /*
            QU is treated as one unit.

            quick → ickquen
          */
          if (
            currentLetter === "q" &&
            nextLetter === "u"
          ) {
            firstVowelPosition += 2;
            continue;
          }

          if (
            vowels.includes(currentLetter)
          ) {
            break;
          }

          firstVowelPosition++;
        }

        /*
          If there is no A, E, I, O, or U,
          simply add EN.
        */
        if (
          firstVowelPosition >= word.length
        ) {

          translatedWord =
            word + "en";

        } else {

          const consonantCluster =
            word.slice(
              0,
              firstVowelPosition
            );

          const restOfWord =
            word.slice(
              firstVowelPosition
            );

          translatedWord =
            restOfWord +
            consonantCluster +
            "en";
        }
      }

      /*
        Preserve capitalization,
        but ONLY capitalize the first letter.

        I    → Siek
        I'm  → Si'mek
        CRAP → Apcren
      */
      const beginsWithCapital =
        /^[A-Z]/.test(originalWord);

      if (
        beginsWithCapital &&
        translatedWord.length > 0
      ) {

        return (
          translatedWord[0].toUpperCase() +
          translatedWord.slice(1)
        );
      }

      return translatedWord;
    }

    function translateText(text) {

      /*
        Treat contractions as one word.

        Supports:

        I'm
        I’m
        don't
        don’t
        I'll
        I’ll
      */
      return text.replace(
        /[A-Za-z]+(?:['’][A-Za-z]+)*/g,
        translateWord
      );
    }

    function runTranslation() {

      outputText.value =
        translateText(
          inputText.value
        );

      message.textContent = "";
    }

    translateButton.addEventListener(
      "click",
      runTranslation
    );

    /*
      Translate automatically
      while typing.
    */
    inputText.addEventListener(
      "input",
      runTranslation
    );

    copyButton.addEventListener(
      "click",
      async function () {

        if (!outputText.value) {

          message.textContent =
            "There is nothing to copy.";

          return;
        }

        try {

          await navigator.clipboard.writeText(
            outputText.value
          );

          message.textContent =
            "Translation copied!";

        } catch (error) {

          outputText.select();

          document.execCommand(
            "copy"
          );

          message.textContent =
            "Translation copied!";
        }
      }
    );

    clearButton.addEventListener(
      "click",
      function () {

        inputText.value = "";
        outputText.value = "";
        message.textContent = "";

        inputText.focus();
      }
    );
  </script>

</body>
</html>
