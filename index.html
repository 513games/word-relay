<script>

  const inputText =
    document.getElementById("inputText");

  const outputText =
    document.getElementById("outputText");

  const translateButton =
    document.getElementById("translateButton");

  const copyButton =
    document.getElementById("copyButton");

  const clearButton =
    document.getElementById("clearButton");

  const message =
    document.getElementById("message");


  /*
    Regular vowels.

    Y is handled separately.
  */
  const vowels = "aeiou";


  /*
    --------------------------------
    NOUN LIST
    --------------------------------

    Any word in this list stays in its
    ORIGINAL order and simply gets EN.

    Then the special letters are applied.

    dog    → dogen    → døgen
    person → personen → persønen
    car    → caren    → căren
    house  → houseen  → høuseen

    Add as many nouns as you want here.
  */

  const nouns = new Set([

    // PEOPLE
    "person",
    "people",
    "man",
    "men",
    "woman",
    "women",
    "boy",
    "boys",
    "girl",
    "girls",
    "child",
    "children",
    "baby",
    "friend",
    "friends",
    "family",
    "father",
    "mother",
    "dad",
    "mom",
    "brother",
    "sister",
    "son",
    "daughter",
    "husband",
    "wife",
    "teacher",
    "student",
    "doctor",
    "nurse",
    "worker",
    "customer",
    "boss",
    "king",
    "queen",
    "knight",
    "soldier",
    "president",

    // ANIMALS
    "dog",
    "dogs",
    "cat",
    "cats",
    "bird",
    "birds",
    "fish",
    "horse",
    "horses",
    "cow",
    "cows",
    "pig",
    "pigs",
    "chicken",
    "chickens",
    "lion",
    "tiger",
    "bear",

    // PLACES
    "house",
    "home",
    "room",
    "bathroom",
    "bedroom",
    "kitchen",
    "office",
    "school",
    "church",
    "store",
    "shop",
    "restaurant",
    "city",
    "town",
    "country",
    "street",
    "road",
    "park",
    "beach",
    "hospital",
    "airport",
    "station",
    "building",
    "hotel",

    // OBJECTS
    "car",
    "truck",
    "bus",
    "train",
    "plane",
    "boat",
    "ship",
    "bike",
    "bicycle",
    "phone",
    "computer",
    "table",
    "chair",
    "bed",
    "door",
    "window",
    "book",
    "paper",
    "pen",
    "pencil",
    "cup",
    "glass",
    "bottle",
    "plate",
    "fork",
    "knife",
    "spoon",
    "bag",
    "box",
    "shirt",
    "shoe",
    "shoes",
    "hat",
    "helmet",
    "mask",
    "skull",
    "flag",
    "board",
    "queen",
    "rook",
    "bishop",
    "pawn",

    // FOOD
    "food",
    "bread",
    "rice",
    "bean",
    "beans",
    "pizza",
    "apple",
    "apples",
    "orange",
    "oranges",
    "banana",
    "bananas",
    "egg",
    "eggs",
    "meat",
    "chicken",
    "beef",
    "fish",
    "cheese",
    "milk",
    "water",
    "coffee",
    "tea",

    // TIME
    "day",
    "days",
    "night",
    "nights",
    "morning",
    "afternoon",
    "evening",
    "week",
    "weeks",
    "month",
    "months",

    // BODY
    "head",
    "face",
    "eye",
    "eyes",
    "ear",
    "ears",
    "nose",
    "mouth",
    "hand",
    "hands",
    "arm",
    "arms",
    "leg",
    "legs",
    "foot",
    "feet",
    "body",
    "hair",
    "heart",

    // NATURE
    "sun",
    "moon",
    "star",
    "stars",
    "sky",
    "rain",
    "snow",
    "wind",
    "tree",
    "trees",
    "flower",
    "flowers",
    "river",
    "lake",
    "ocean",
    "sea",
    "mountain",
    "earth",

    // ABSTRACT / COMMON NOUNS
    "life",
    "love",
    "war",
    "peace",
    "work",
    "job",
    "money",
    "game",
    "music",
    "language",
    "word",
    "words",
    "name",
    "idea",
    "problem",
    "question",
    "answer",
    "thing",
    "things",
    "way",
    "place",
    "part",
    "world",
    "company",
    "product",
    "products"
  ]);


  /*
    --------------------------------
    SPECIAL LETTERS
    --------------------------------

    a → ă
    o → ø
    i → ì

    A → Ă
    O → Ø
    I → Ì

    E and U stay normal.
  */

  function applySpecialLetters(text) {

    return text
      .replace(/a/g, "ă")
      .replace(/A/g, "Ă")
      .replace(/o/g, "ø")
      .replace(/O/g, "Ø")
      .replace(/i/g, "ì")
      .replace(/I/g, "Ì");
  }


  /*
    Preserve only initial capitalization.
  */

  function preserveCapitalization(
    originalWord,
    translatedWord
  ) {

    const beginsWithCapital =
      /^[A-Z]/.test(originalWord);


    if (
      beginsWithCapital &&
      translatedWord.length > 0
    ) {

      return (
        translatedWord[0].toUpperCase() +
        translatedWord.slice(1)
      );
    }


    return translatedWord;
  }


  function translateWord(originalWord) {

    const word =
      originalWord.toLowerCase();


    if (!word) {
      return "";
    }


    let translatedWord = "";


    /*
      --------------------------------
      NOUN RULE
      --------------------------------

      Nouns DO NOT move letters.

      They simply receive EN.

      dog
      → dogen
      → døgen

      car
      → caren
      → căren

      person
      → personen
      → persønen
    */

    if (nouns.has(word)) {

      translatedWord =
        word + "en";


      translatedWord =
        preserveCapitalization(
          originalWord,
          translatedWord
        );


      return applySpecialLetters(
        translatedWord
      );
    }


    /*
      Check whether the word contains
      A, E, I, O, or U.
    */

    const hasRegularVowel =
      [...word].some(
        letter =>
          vowels.includes(letter)
      );


    /*
      --------------------------------
      VOWEL-STARTING WORDS
      --------------------------------

      S + WORD + EK

      am
      → samek
      → sămek

      open
      → sopenek
      → søpenek

      I
      → siek
      → sìek
    */

    if (
      vowels.includes(word[0])
    ) {

      translatedWord =
        "s" + word + "ek";
    }


    /*
      --------------------------------
      CONSONANT-STARTING WORDS
      --------------------------------
    */

    else {

      let firstVowelPosition = -1;


      /*
        Normal A/E/I/O/U case.
      */

      if (hasRegularVowel) {

        for (
          let i = 0;
          i < word.length;
          i++
        ) {

          const currentLetter =
            word[i];

          const nextLetter =
            word[i + 1];


          /*
            QU stays together.

            quick
            → ickquen
            → ìckquen
          */

          if (
            currentLetter === "q" &&
            nextLetter === "u"
          ) {

            i++;

            continue;
          }


          if (
            vowels.includes(
              currentLetter
            )
          ) {

            firstVowelPosition = i;

            break;
          }
        }
      }


      /*
        --------------------------------
        Y FALLBACK
        --------------------------------

        If there is no A/E/I/O/U,
        Y becomes the vowel.

        thy
        → ythen

        fly
        → yflen

        cry
        → ycren

        my
        → ymen
      */

      else {

        firstVowelPosition =
          word.indexOf("y");
      }


      /*
        No vowel and no Y.
      */

      if (
        firstVowelPosition === -1
      ) {

        translatedWord =
          word + "en";
      }


      /*
        Move the opening consonant
        or consonant cluster to the end
        and add EN.
      */

      else {

        const consonantCluster =
          word.slice(
            0,
            firstVowelPosition
          );


        const restOfWord =
          word.slice(
            firstVowelPosition
          );


        translatedWord =
          restOfWord +
          consonantCluster +
          "en";
      }
    }


    /*
      Preserve capitalization.
    */

    translatedWord =
      preserveCapitalization(
        originalWord,
        translatedWord
      );


    /*
      Apply the special letters LAST.
    */

    translatedWord =
      applySpecialLetters(
        translatedWord
      );


    return translatedWord;
  }


  function translateText(text) {

    /*
      Preserve contractions as
      individual words.

      I'm
      I’m
      don't
      don’t
      I'll
      I’ll
    */

    return text.replace(
      /[A-Za-z]+(?:['’][A-Za-z]+)*/g,
      translateWord
    );
  }


  function runTranslation() {

    outputText.value =
      translateText(
        inputText.value
      );

    message.textContent = "";
  }


  translateButton.addEventListener(
    "click",
    runTranslation
  );


  /*
    Translate automatically
    while typing.
  */

  inputText.addEventListener(
    "input",
    runTranslation
  );


  /*
    Copy
  */

  copyButton.addEventListener(
    "click",

    async function () {

      if (!outputText.value) {

        message.textContent =
          "There is nothing to copy.";

        return;
      }


      try {

        await navigator.clipboard.writeText(
          outputText.value
        );

        message.textContent =
          "Translation copied!";

      } catch (error) {

        outputText.select();

        document.execCommand(
          "copy"
        );

        message.textContent =
          "Translation copied!";
      }
    }
  );


  /*
    Clear
  */

  clearButton.addEventListener(
    "click",

    function () {

      inputText.value = "";

      outputText.value = "";

      message.textContent = "";

      inputText.focus();
    }
  );

</script>
