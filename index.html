<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Letter Before Translator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #0d1117;
      color: #f0f6fc;

      font-family: Arial, sans-serif;
    }

    .translator {
      width: 100%;
      max-width: 700px;
      padding: 28px;

      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;

      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      text-align: center;
    }

    .description {
      margin-top: 0;
      margin-bottom: 24px;

      color: #8b949e;
      text-align: center;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      padding: 14px;
      margin-bottom: 16px;

      resize: vertical;

      background: #21262d;
      color: #f0f6fc;

      border: 1px solid #30363d;
      border-radius: 10px;

      font-family: inherit;
      font-size: 17px;
      line-height: 1.5;
    }

    textarea:focus {
      outline: 2px solid #58a6ff;
      border-color: transparent;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    button {
      flex: 1;
      padding: 12px 16px;

      border: none;
      border-radius: 9px;

      background: #238636;
      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.12);
    }

    #copyButton {
      background: #1f6feb;
    }

    #clearButton {
      background: #30363d;
    }

    .examples {
      margin-top: 8px;
      padding: 14px;

      background: #21262d;
      border-radius: 10px;

      color: #8b949e;
      line-height: 1.7;
    }

    .examples strong {
      color: #f0f6fc;
    }

    #message {
      min-height: 20px;
      margin-top: -8px;
      margin-bottom: 12px;

      color: #3fb950;
      font-size: 14px;
    }

    @media (max-width: 550px) {
      .buttons {
        flex-direction: column;
      }

      .translator {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <main class="translator">

    <h1>Letter Before Translator</h1>

    <p class="description">
      Every letter changes to the letter immediately before it
      in the alphabet.
      <strong>A becomes Z, B becomes A, C becomes B</strong>,
      and so on.
    </p>

    <label for="inputText">
      English
    </label>

    <textarea
      id="inputText"
      placeholder="Type something here..."
    ></textarea>

    <div class="buttons">

      <button id="translateButton">
        Translate
      </button>

      <button id="copyButton">
        Copy
      </button>

      <button id="clearButton">
        Clear
      </button>

    </div>

    <div id="message"></div>

    <label for="outputText">
      Letter Before Code
    </label>

    <textarea
      id="outputText"
      placeholder="Your coded text will appear here..."
      readonly
    ></textarea>

    <div class="examples">

      <strong>Examples</strong><br><br>

      Dog → Cnf<br>
      Hello → Gdkkn<br>
      Thank you → Sgzmj xnt<br>
      You try → Xnt sqx<br>
      My fault → Lx eztks<br>
      See this is easy → Rdd sghr hr dzrx

    </div>

  </main>

  <script>

    const inputText =
      document.getElementById("inputText");

    const outputText =
      document.getElementById("outputText");

    const translateButton =
      document.getElementById("translateButton");

    const copyButton =
      document.getElementById("copyButton");

    const clearButton =
      document.getElementById("clearButton");

    const message =
      document.getElementById("message");


    /*
      LETTER BEFORE RULE

      Every English letter moves
      backward by one position:

      b → a
      c → b
      d → c

      a wraps around to z.

      Capital letters follow
      the same rule:

      B → A
      C → B
      A → Z
    */


    /*
      Move one letter backward.

      Non-English letters, spaces,
      numbers, punctuation, and symbols
      remain unchanged.
    */

    function moveLetterBackward(character) {

      const code =
        character.charCodeAt(0);


      // Lowercase a becomes z.
      if (character === "a") {
        return "z";
      }


      // Uppercase A becomes Z.
      if (character === "A") {
        return "Z";
      }


      // Lowercase letters b through z.
      if (code >= 98 && code <= 122) {

        return String.fromCharCode(
          code - 1
        );
      }


      // Uppercase letters B through Z.
      if (code >= 66 && code <= 90) {

        return String.fromCharCode(
          code - 1
        );
      }


      // Leave everything else alone.
      return character;
    }


    /*
      Translate the complete text.
    */

    function translateText(text) {

      return Array.from(text)
        .map(moveLetterBackward)
        .join("");
    }


    /*
      Run the translation.
    */

    function runTranslation() {

      outputText.value =
        translateText(
          inputText.value
        );

      message.textContent = "";
    }


    translateButton.addEventListener(
      "click",
      runTranslation
    );


    /*
      Translate automatically
      while typing.
    */

    inputText.addEventListener(
      "input",
      runTranslation
    );


    /*
      Copy the coded text.
    */

    copyButton.addEventListener(
      "click",

      async function () {

        if (!outputText.value) {

          message.textContent =
            "There is nothing to copy.";

          return;
        }


        try {

          await navigator.clipboard.writeText(
            outputText.value
          );

          message.textContent =
            "Coded text copied!";

        } catch (error) {

          outputText.select();

          document.execCommand(
            "copy"
          );

          message.textContent =
            "Coded text copied!";
        }
      }
    );


    /*
      Clear both boxes.
    */

    clearButton.addEventListener(
      "click",

      function () {

        inputText.value = "";
        outputText.value = "";
        message.textContent = "";

        inputText.focus();
      }
    );

  </script>

</body>
</html>
